name: capacity-v2-003
run-name: ${{ inputs.helio_execution_id }}
'on':
  workflow_dispatch:
    inputs:
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_release_id:
        type: string
        required: false
        default: ''
      workflow_revision:
        type: string
        required: false
        default: ''
      release_version:
        type: string
        required: false
        default: ''
      environment:
        type: string
        default: capacity-v2-003-production
permissions:
  contents: read
  deployments: write
concurrency:
  group: capacity-v2-003-release
  cancel-in-progress: false
jobs:
  test:
    runs-on:
      - helio-tomcat
    timeout-minutes: 10
    environment: capacity-v2-003-test
    steps:
      - name: Synthetic runner work
        shell: bash
        run: sleep 30
  production:
    needs: test
    runs-on:
      - helio-tomcat
    timeout-minutes: 10
    environment: capacity-v2-003-production
    steps:
      - name: Synthetic runner work
        shell: bash
        run: sleep 30
      - name: Record synthetic deployment evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: capacity-v2-003
          TARGET_ENVIRONMENT: capacity-v2-003-production
          HELIO_EXECUTION_ID: ${{ inputs.helio_execution_id }}
          HELIO_RELEASE_ID: ${{ inputs.helio_release_id }}
          WORKFLOW_REVISION: ${{ inputs.workflow_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |-
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, uuid
          uuid.UUID(os.environ["HELIO_RELEASE_ID"])
          assert re.fullmatch(r"[A-Za-z0-9._:-]{1,200}", os.environ["HELIO_EXECUTION_ID"])
          assert os.environ["WORKFLOW_REVISION"] == os.environ["GITHUB_SHA"]
          artifact = pathlib.Path("synthetic-artifact.json")
          artifact.write_text(json.dumps({"application": os.environ["APP_SLUG"], "version": os.environ["RELEASE_VERSION"], "commit": os.environ["GITHUB_SHA"]}, sort_keys=True))
          digest = "sha256:" + hashlib.sha256(artifact.read_bytes()).hexdigest()
          deployed = pathlib.Path("synthetic-deployed.json")
          deployed.write_bytes(artifact.read_bytes())
          assert "sha256:" + hashlib.sha256(deployed.read_bytes()).hexdigest() == digest
          payload = {"schema_version": 1, "helio_execution_id": os.environ["HELIO_EXECUTION_ID"], "release_id": os.environ["HELIO_RELEASE_ID"], "artifact_digest": digest, "artifact_uri": "urn:helio-capacity:" + os.environ["APP_SLUG"] + "@" + digest, "rollback_workflow_id": ".github/workflows/" + os.environ["APP_SLUG"] + ".yml", "workflow_revision": os.environ["WORKFLOW_REVISION"]}
          pathlib.Path("deployment-evidence.json").write_text(json.dumps({"ref": os.environ["GITHUB_SHA"], "auto_merge": False, "required_contexts": [], "environment": os.environ["TARGET_ENVIRONMENT"], "task": "helio-forward-release", "payload": payload}))
          PY
          deployment_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input deployment-evidence.json --jq .id)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" -f state=success -f description="Synthetic capacity artifact copied and digest verified; no application deployment" > /dev/null
