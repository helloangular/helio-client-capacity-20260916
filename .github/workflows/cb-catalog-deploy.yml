name: cb-catalog-deploy
# Catalog lane B (17 Oct 2026): synthetic Environment Catalog template for the BlueMatrix
# Environment Catalog cases on GitHub App B. Its only caller is
# helloangular/helio-fixture-catalog-b-20261017. No real deployment.
# Two stages (qa, production), one environment each in the catalog. Shape required by Helio
# (env_catalog/template.clj): one matrix job per stage reading HELIO_ENVIRONMENTS, with the
# targeted form for single-environment redeploy and rollback.
# Failure switch: a commit of the caller carrying .helio-cb/catalog-fail/<environment> fails
# that environment's job; every other commit deploys.
on:
  workflow_call:
    inputs:
      helio_execution_id:
        type: string
        required: false
        default: ''
      helio_target_environment:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  qa:
    name: qa (${{ matrix.environment }})
    if: ${{ vars.HELIO_ENVIRONMENTS != '' && contains(fromJSON(vars.HELIO_ENVIRONMENTS).order, 'qa') && (inputs.helio_target_environment == '' || contains(fromJSON(vars.HELIO_ENVIRONMENTS).qa, inputs.helio_target_environment)) }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ inputs.helio_target_environment != '' && fromJSON(format('["{0}"]', inputs.helio_target_environment)) || fromJSON(vars.HELIO_ENVIRONMENTS).qa }}
    environment: ${{ matrix.environment }}
    runs-on: ${{ fromJSON(vars.HELIO_ENVIRONMENTS).runs_on[matrix.environment] }}
    timeout-minutes: 10
    concurrency:
      group: cb-catalog-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - name: Catalog lane B failure switch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -uo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.helio-cb/catalog-fail/$TARGET_ENVIRONMENT?ref=$GITHUB_SHA")"
          if [ "$code" = "200" ]; then
            echo "Catalog lane B: commit $GITHUB_SHA marks $TARGET_ENVIRONMENT to fail; this environment's deployment fails."
            exit 1
          fi
          echo "Catalog lane B failure switch: not marked (HTTP $code)."
      - name: Synthetic deployment
        shell: bash
        run: |
          echo "Synthetic catalog deployment of ${GITHUB_SHA} to ${{ matrix.environment }} (stage qa); no application is deployed."
          sleep 20
  production:
    name: production (${{ matrix.environment }})
    needs: [qa]
    if: ${{ !failure() && !cancelled() && vars.HELIO_ENVIRONMENTS != '' && contains(fromJSON(vars.HELIO_ENVIRONMENTS).order, 'production') && (inputs.helio_target_environment == '' || contains(fromJSON(vars.HELIO_ENVIRONMENTS).production, inputs.helio_target_environment)) }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ inputs.helio_target_environment != '' && fromJSON(format('["{0}"]', inputs.helio_target_environment)) || fromJSON(vars.HELIO_ENVIRONMENTS).production }}
    environment: ${{ matrix.environment }}
    runs-on: ${{ fromJSON(vars.HELIO_ENVIRONMENTS).runs_on[matrix.environment] }}
    timeout-minutes: 10
    concurrency:
      group: cb-catalog-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - name: Catalog lane B failure switch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          set -uo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.helio-cb/catalog-fail/$TARGET_ENVIRONMENT?ref=$GITHUB_SHA")"
          if [ "$code" = "200" ]; then
            echo "Catalog lane B: commit $GITHUB_SHA marks $TARGET_ENVIRONMENT to fail; this environment's deployment fails."
            exit 1
          fi
          echo "Catalog lane B failure switch: not marked (HTTP $code)."
      - name: Synthetic deployment
        shell: bash
        run: |
          echo "Synthetic catalog deployment of ${GITHUB_SHA} to ${{ matrix.environment }} (stage production); no application is deployed."
          sleep 20
